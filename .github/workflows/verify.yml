name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out builder
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Create read-only source token
        id: source-token
        if: vars.PLUGIN_SOURCE_APP_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PLUGIN_SOURCE_APP_ID }}
          private-key: ${{ secrets.PLUGIN_SOURCE_APP_PRIVATE_KEY }}
          owner: ${{ vars.PLUGIN_SOURCE_OWNER }}
          repositories: ${{ vars.PLUGIN_SOURCE_REPOSITORIES }}
          permission-contents: read
      - name: Build catalog
        env:
          PLUGIN_SOURCE_TOKEN: ${{ steps.source-token.outputs.token || secrets.PLUGIN_SOURCE_TOKEN }}
        run: npm run build
