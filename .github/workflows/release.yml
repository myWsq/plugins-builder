name: release-marketplace

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: plugins-marketplace-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out builder
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate release tag
        run: npm run check:tag -- "${GITHUB_REF_NAME}"
      - id: source
        name: Resolve tagged source revision
        run: |
          source_revision="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          echo "sha=${source_revision}" >> "${GITHUB_OUTPUT}"
      - name: Require tagged commit on main
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.sha }}
        run: |
          if ! git merge-base --is-ancestor "${SOURCE_REVISION}" origin/main; then
            echo "::error::Release tag must point to a commit on main"
            exit 1
          fi
      - name: Run tests
        run: npm test
      - name: Create read-only source token
        id: source-token
        if: vars.PLUGIN_SOURCE_APP_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PLUGIN_SOURCE_APP_ID }}
          private-key: ${{ secrets.PLUGIN_SOURCE_APP_PRIVATE_KEY }}
          owner: ${{ vars.PLUGIN_SOURCE_OWNER }}
          repositories: ${{ vars.PLUGIN_SOURCE_REPOSITORIES }}
          permission-contents: read
      - name: Build catalog
        env:
          PLUGIN_SOURCE_TOKEN: ${{ steps.source-token.outputs.token || secrets.PLUGIN_SOURCE_TOKEN }}
          SOURCE_REVISION: ${{ steps.source.outputs.sha }}
        run: npm run build

      - name: Require publishing credential
        env:
          DEPLOY_KEY: ${{ secrets.MARKETPLACE_REPO_SSH_KEY }}
        run: |
          if test -z "${DEPLOY_KEY}"; then
            echo "::error::Missing MARKETPLACE_REPO_SSH_KEY"
            exit 1
          fi
      - name: Check out generated marketplace
        uses: actions/checkout@v4
        with:
          repository: myWsq/plugins
          ref: main
          ssh-key: ${{ secrets.MARKETPLACE_REPO_SSH_KEY }}
          ssh-strict: true
          path: release
          persist-credentials: true
      - name: Enforce plugin version contract
        run: npm run check:release -- --current release --next dist
      - name: Sync generated tree
        run: node src/sync-release.mjs --target release
      - name: Publish
        working-directory: release
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.sha }}
        run: |
          if test -z "$(git status --porcelain)"; then
            exit 0
          fi
          git config user.name "plugins-release[bot]"
          git config user.email "plugins-release[bot]@users.noreply.github.com"
          git add --all
          git commit -m "release: ${GITHUB_REF_NAME} from ${SOURCE_REVISION}"
          git push origin HEAD:main
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
